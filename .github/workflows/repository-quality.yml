name: Repository Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  validate-foundation:
    name: Validate Repository Foundation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate script syntax
        run: |
          python3 -m py_compile scripts/validate_repo.py
          bash -n scripts/quality_gate.sh

      - name: Execute Quality Gate Validator
        run: |
          python3 scripts/validate_repo.py
